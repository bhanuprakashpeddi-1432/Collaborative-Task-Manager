# ──────────────────────────────────────────────────────────────────────────────
# WorkCollab — Continuous Integration Pipeline
# ──────────────────────────────────────────────────────────────────────────────
# Triggers on pushes and PRs to main. Runs:
#   1. Backend: lint, unit tests, integration tests (Testcontainers)
#   2. Frontend: lint (oxlint), TypeScript + Vite build verification
#   3. Docker: build verification for both images
# ──────────────────────────────────────────────────────────────────────────────

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # ── Backend Tests ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests (unit + integration with Testcontainers)
        run: ./mvnw verify -B -ntp

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: target/surefire-reports/
          retention-days: 7

  # ── Frontend Lint & Build ─────────────────────────────────────────────────
  frontend-lint-build:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (TypeScript + Vite)
        run: npm run build

  # ── Docker Build Verification ─────────────────────────────────────────────
  docker-build:
    name: Docker — Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: workcollab-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: workcollab-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
