version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: workcollab-db
    environment:
      POSTGRES_DB: workcollab
      POSTGRES_USER: root
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
